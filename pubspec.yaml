name: audio_call_app
description: "A minimal Flutter audio-calling app using WebRTC."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc: ^1.6.1
  web_socket_channel: ^3.0.3
  permission_handler: ^13.0.2
  audio_session: ^0.2.4
  http: ^1.6.0
  shared_preferences: ^2.5.5
  http_parser: ^4.1.2
  ffmpeg_kit_flutter_new: ^4.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
